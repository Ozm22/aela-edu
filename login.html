<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | الأكاديمية العربية</title>
    
    <!-- مكتبة التصميم Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- مكتبة قاعدة البيانات Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #fdfbf7; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4">

    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        
        <div class="text-center mb-6">
            <a href="index.html" class="text-sm text-gray-400 hover:text-[#134e4a] block mb-4">← العودة للرئيسية</a>
            <h1 class="text-2xl font-extrabold text-[#134e4a] mb-1">الأكاديمية العربية</h1>
            <p class="text-gray-500 text-sm font-semibold">بوابة دخول الطلاب</p>
        </div>

        <!-- صندوق التنبيهات (يظهر عند الخطأ أو النجاح) -->
        <div id="alert-box" class="hidden mb-5 p-4 rounded-lg text-sm font-bold text-center border"></div>

        <!-- نموذج تسجيل الدخول -->
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-gray-700 font-bold mb-1 text-sm">الرقم الأكاديمي</label>
                <input type="text" id="academicId" placeholder="مثال: 123" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:outline-none focus:border-[#134e4a]" required>
            </div>
            
            <div>
                <label class="block text-gray-700 font-bold mb-1 text-sm">كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:outline-none focus:border-[#134e4a]" required>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-[#134e4a] text-white font-bold text-lg py-3 mt-2 rounded-lg hover:bg-teal-800 transition shadow-md">
                تسجيل الدخول
            </button>
        </form>
    </div>

    <!-- كود البرمجة والربط بقاعدة البيانات -->
    <script>
        // إعدادات الربط بمشروعك في Supabase
        const SUPABASE_URL = 'https://ovxstsmbzeuanbylmefq.supabase.co';
        const SUPABASE_KEY = 'Sb_publishable_xVQ6FzQf0Y44JaMTHkIkGA_shW0UU2h';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // الدالة التي تعمل عند الضغط على زر "تسجيل الدخول"
        async function handleLogin(event) {
            // منع تحديث الصفحة الافتراضي
            event.preventDefault(); 
            
            // قراءة البيانات من الخانات
            const idInput = document.getElementById('academicId').value.trim();
            const passInput = document.getElementById('password').value.trim();
            const btn = document.getElementById('submit-btn');
            const alertBox = document.getElementById('alert-box');

            // تغيير شكل الزر ليدل على التحميل
            btn.innerText = 'جاري التحقق...';
            btn.disabled = true;
            btn.classList.add('opacity-75');
            alertBox.classList.add('hidden'); // إخفاء أي رسالة سابقة
            alertBox.innerHTML = ''; 

            try {
                // الاتصال بقاعدة البيانات للبحث عن الطالب
                const { data, error } = await supabase
                    .from('students')
                    .select('*')
                    .eq('academic_id', idInput)
                    .eq('password', passInput)
                    .single();

                if (error || !data) {
                    // حالة (1): الرقم الأكاديمي أو الباسورد خطأ
                    showAlert('الرقم الأكاديمي أو كلمة المرور غير صحيحة.', 'bg-red-50', 'text-red-700', 'border-red-200');
                    resetButton(btn);
                } else {
                    // الطالب موجود وصحيح.. الآن نفحص حالة الدفع
                    if (data.payment_status === 'unpaid') {
                        // حالة (2): الطالب ما كان دافع (unpaid)
                        const unpaidMessage = `
                            عفواً، حسابك معلق مؤقتاً لعدم استكمال سداد الرسوم.<br><br>
                            <a href="payment.html" class="inline-block mt-3 bg-[#d97706] text-white px-6 py-2 rounded-full shadow hover:bg-yellow-600 transition">رفع سند الدفع الآن</a>
                        `;
                        showAlert(unpaidMessage, 'bg-yellow-50', 'text-yellow-800', 'border-yellow-300');
                        resetButton(btn);
                    } else if (data.payment_status === 'paid') {
                        // حالة (3): الطالب دافع (paid)
                        showAlert('تم تسجيل الدخول بنجاح! جاري التوجيه...', 'bg-green-50', 'text-green-800', 'border-green-300');
                        
                        // نقله لصفحة البداية بعد ثانية ونصف
                        setTimeout(() => {
                            window.location.href = 'coming-soon.html';
                        }, 1500);
                    } else {
                        // حالة احتياطية لو كان هناك قيمة أخرى غير paid و unpaid
                        showAlert('حالة الحساب غير معروفة. يرجى مراجعة الإدارة.', 'bg-gray-50', 'text-gray-800', 'border-gray-300');
                        resetButton(btn);
                    }
                }
            } catch (err) {
                // حالة انقطاع الإنترنت أو تعليق السيرفر
                showAlert('حدث خطأ في الاتصال بالخادم. يرجى التأكد من الإنترنت.', 'bg-red-50', 'text-red-700', 'border-red-200');
                resetButton(btn);
            }
        }

        // دالة لإعادة الزر لشكله الطبيعي
        function resetButton(btn) {
            btn.innerText = 'تسجيل الدخول';
            btn.disabled = false;
            btn.classList.remove('opacity-75');
        }

        // دالة لعرض الرسائل الملونة
        function showAlert(message, bgClass, textClass, borderClass) {
            const alertBox = document.getElementById('alert-box');
            alertBox.innerHTML = message;
            alertBox.className = `mb-5 p-4 rounded-lg text-sm font-bold text-center border block leading-relaxed ${bgClass} ${textClass} ${borderClass}`;
        }
    </script>
</body>
</html>
