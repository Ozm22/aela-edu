<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | الأكاديمية العربية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استدعاء مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'ozm-green': '#134e4a',
                        'ozm-gold': '#d97706',
                    },
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #fdfbf7; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-ozm-green mb-2">الأكاديمية العربية</h1>
            <p class="text-gray-500 font-semibold">بوابة دخول الطلاب</p>
        </div>

        <!-- رسائل التنبيه (مخفية افتراضياً) -->
        <div id="alert-box" class="hidden mb-4 p-4 rounded-lg text-sm font-bold text-center"></div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-gray-700 font-bold mb-2">الرقم الأكاديمي</label>
                <input type="text" id="academicId" placeholder="مثال: 2026001" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:outline-none focus:border-ozm-green" required>
            </div>
            
            <div>
                <label class="block text-gray-700 font-bold mb-2">كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:outline-none focus:border-ozm-green" required>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-ozm-green text-white font-bold text-lg py-3 rounded-lg hover:bg-teal-800 transition shadow-md">
                تسجيل الدخول
            </button>
        </form>
    </div>

    <script>
        // رابط مشروعك ومفتاح الـ API
        const SUPABASE_URL = 'https://ovxstsmbzeuanbylmefq.supabase.co';
        const SUPABASE_KEY = 'Sb_publishable_xVQ6FzQf0Y44JaMTHkIkGA_shW0UU2h';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function handleLogin(event) {
            event.preventDefault(); // منع تحديث الصفحة
            
            const idInput = document.getElementById('academicId').value.trim();
            const passInput = document.getElementById('password').value.trim();
            const btn = document.getElementById('submit-btn');
            const alertBox = document.getElementById('alert-box');

            // تغيير شكل الزر أثناء التحميل
            btn.innerText = 'جاري التحقق...';
            btn.disabled = true;
            alertBox.classList.add('hidden');

            try {
                // البحث في قاعدة البيانات عن الرقم الأكاديمي وكلمة المرور
                const { data, error } = await supabase
                    .from('students')
                    .select('*')
                    .eq('academic_id', idInput)
                    .eq('password', passInput)
                    .single();

                if (error || !data) {
                    // حالة خطأ في البيانات
                    showAlert('الرقم الأكاديمي أو كلمة المرور غير صحيحة.', 'bg-red-100', 'text-red-700', 'border-red-200');
                } else {
                    // حالة البيانات صحيحة.. نتحقق من الدفع الآن
                    if (data.payment_status === 'unpaid') {
                        showAlert('عفواً، حسابك معلق مؤقتاً لعدم استكمال سداد الرسوم. يرجى مراجعة الإدارة المالية.', 'bg-yellow-100', 'text-yellow-800', 'border-yellow-300');
                    } else {
                        // حالة الدفع صحيحة (نجاح الدخول)
                        showAlert('تم تسجيل الدخول بنجاح! جاري التوجيه...', 'bg-green-100', 'text-green-800', 'border-green-300');
                    }
                }
            } catch (err) {
                showAlert('حدث خطأ في الاتصال بالسيرفر. حاول مرة أخرى.', 'bg-red-100', 'text-red-700', 'border-red-200');
            } finally {
                btn.innerText = 'تسجيل الدخول';
                btn.disabled = false;
            }
        }

        function showAlert(message, bgClass, textClass, borderClass) {
            const alertBox = document.getElementById('alert-box');
            alertBox.className = `mb-4 p-4 rounded-lg text-sm font-bold border ${bgClass} ${textClass} ${borderClass}`;
            alertBox.innerText = message;
        }
    </script>
</body>
</html>
