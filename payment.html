<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الدفع | الأكاديمية العربية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #fdfbf7; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4 py-8">

    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-lg border border-gray-100">
        
        <div class="text-center mb-6 border-b pb-4">
            <a href="index.html" class="text-sm text-gray-400 hover:text-[#134e4a] block mb-2">← العودة للرئيسية</a>
            <h1 class="text-2xl font-extrabold text-[#134e4a]">بوابة تأكيد الدفع</h1>
            <p class="text-gray-500 text-sm font-semibold mt-1">يرجى إرفاق سند الحوالة لتفعيل حسابك الأكاديمي</p>
        </div>

        <form id="payment-form" onsubmit="submitPayment(event)" class="space-y-5">
            
            <!-- رمز الفاتورة المولد تلقائياً -->
            <div class="bg-blue-50 p-4 rounded-lg border border-blue-100 text-center">
                <label class="block text-blue-800 font-bold mb-1 text-sm">رقم الفاتورة المرجعي</label>
                <input type="text" id="invoiceId" readonly class="w-full text-center bg-transparent text-xl font-extrabold text-blue-900 outline-none select-none">
            </div>

            <div>
                <label class="block text-gray-700 font-bold mb-1 text-sm">الاسم الرباعي للطالب</label>
                <input type="text" id="studentName" placeholder="أدخل اسمك كما في طلب التسجيل" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:outline-none focus:border-[#134e4a]" required>
            </div>
            
            <div>
                <label class="block text-gray-700 font-bold mb-1 text-sm">الرقم الأكاديمي (ID)</label>
                <input type="text" id="academicId" placeholder="الرقم الذي حصلت عليه من الإدارة" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:outline-none focus:border-[#134e4a]" required>
            </div>

            <div class="bg-teal-50 p-4 rounded-lg border-2 border-dashed border-teal-200">
                <label class="block font-bold text-[#134e4a] mb-2">إرفاق صورة السند / الحوالة</label>
                <input type="file" id="receiptFile" accept="image/*,.pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-teal-100 file:text-teal-700 hover:file:bg-teal-200 cursor-pointer" required>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-[#d97706] text-white font-bold text-lg py-3 mt-4 rounded-lg hover:bg-yellow-600 transition shadow-md">
                إرسال السند للمطابقة
            </button>
        </form>

        <div id="success-msg" class="hidden mt-6 text-center bg-green-50 p-4 rounded-lg border border-green-200">
            <div class="text-3xl mb-2">✅</div>
            <h3 class="text-lg font-bold text-green-800">تم استلام السند بنجاح!</h3>
            <p class="text-sm text-green-700 mt-1">سيتم مطابقة السند وتفعيل حسابك قريباً. يمكنك تجربة تسجيل الدخول لاحقاً.</p>
            <a href="login.html" class="inline-block mt-4 text-[#134e4a] font-bold underline">الذهاب لصفحة تسجيل الدخول</a>
        </div>

    </div>

    <script>
        // توليد رقم فاتورة عشوائي عند فتح الصفحة
        window.onload = function() {
            const randomNum = Math.floor(100000 + Math.random() * 900000); // 6 أرقام عشوائية
            document.getElementById('invoiceId').value = 'INV-' + randomNum;
        };

        async function submitPayment(event) {
            event.preventDefault();
            
            const btn = document.getElementById('submit-btn');
            const originalText = btn.innerText;
            btn.innerText = 'جاري الإرسال... (نرجو الانتظار)';
            btn.disabled = true;

            const invoiceId = document.getElementById('invoiceId').value;
            const studentName = document.getElementById('studentName').value;
            const academicId = document.getElementById('academicId').value;
            const receiptFile = document.getElementById('receiptFile').files[0];

            const message = `
💰 **تأكيد دفع جديد** 💰
رقم الفاتورة: ${invoiceId}
اسم الطالب: ${studentName}
الرقم الأكاديمي: ${academicId}
            `;
            
            const botToken = '8868584934:AAE0jkikO04FtbUbRh8jrwR3ComrJ3md_ho'; // نفس البوت
            const chatId = '5478867416'; 

            try {
                // إرسال الصورة/السند مع النص كشرح للصورة
                const formData = new FormData();
                formData.append('chat_id', chatId);
                formData.append('document', receiptFile);
                formData.append('caption', message);

                const response = await fetch(`https://api.telegram.org/bot${botToken}/sendDocument`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('فشل الإرسال');

                // إخفاء النموذج وإظهار رسالة النجاح
                document.getElementById('payment-form').classList.add('hidden');
                document.getElementById('success-msg').classList.remove('hidden');

            } catch (error) {
                alert('حدث خطأ أثناء الإرسال. تأكد من اتصالك بالإنترنت وحاول مرة أخرى.');
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
